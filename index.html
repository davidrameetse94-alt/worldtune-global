    <script>
// Zone 12164778: 2-stage Play Click logic
let wt2 = parseInt(sessionStorage.getItem('wt2') || '0');

function loadMonetagTag() {
  if (document.getElementById('monetag-pop-script')) return;
  const s = document.createElement('script');
  s.id = 'monetag-pop-script';
  s.src = 'https://al5sm.com/tag.min.js';
  s.setAttribute('data-zone', '12164778');
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  document.body.appendChild(s);
}

// Global 3-second delay timer for zone 12185969
let globalPopunderReady = false;
setTimeout(function() {
  globalPopunderReady = true;
  console.log('Monetag zone 12185969 global background popunder ready after 3 seconds');
}, 3000);

document.addEventListener('click', function(e) {
  const b = e.target.closest('button');
  const isPlayButton = b && b.innerText.toLowerCase().includes('play');

  if (isPlayButton) {
    wt2++;
    sessionStorage.setItem('wt2', wt2);
    console.log('video play #', wt2);

    if (wt2 === 1) {
      // 1st Play click: load tag in background async (no ad yet)
      console.log('1st Play click: Loading Monetag tag in background async (no ad yet)...');
      loadMonetagTag();
    } else if (wt2 >= 2) {
      // 2nd Play click: tag is already loaded, Monetag auto pops ad on this click
      console.log('2nd Play click: Ad triggering on zone 12164778');

      // Mark that zone 12164778 just fired so zone 12185969 is skipped for this click
      sessionStorage.setItem('zone_12164778_just_fired', '1');

      // Ensure tag is present just in case of reload on count 1
      loadMonetagTag();

      // Alert user as requested
      try {
        alert("Ad opening - check new tab");
      } catch(err) {
        console.warn('Alert notification:', err);
      }
      try {
        window.dispatchEvent(new CustomEvent('wt-ad-opening'));
      } catch(err) {}

      // Reset counter to 0
      sessionStorage.setItem('wt2', '0');
      wt2 = 0;

      // Remove tag after 2 seconds
      setTimeout(function() {
        const el = document.getElementById('monetag-pop-script');
        if (el && el.parentNode) {
          el.parentNode.removeChild(el);
          console.log('Removed Monetag tag 12164778 after 2 seconds');
        }
      }, 2000);

      // Reset the skip flag shortly after this click cycle finishes
      setTimeout(function() {
        sessionStorage.removeItem('zone_12164778_just_fired');
      }, 300);

      return;
    }
  }

  // Zone 12185969 check: if zone 12164778 just fired, skip 12185969 for that click
  if (sessionStorage.getItem('zone_12164778_just_fired') === '1') {
    console.log('Skipping zone 12185969 because zone 12164778 just fired on this click');
    return;
  }

  if (globalPopunderReady && !isPlayButton) {
    console.log('Zone 12185969 active for user click (after 3s)');
  }
});
</script>
