<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="All Genres • Full YouTube • Worldwide Hits - Stream and preview the hottest global tracks" />
    <meta property="og:title" content="WorldTune Global - All Genres • Full YouTube • Worldwide Hits" />
    <meta property="og:description" content="All Genres • Full YouTube • Worldwide Hits - Stream and preview the hottest global tracks" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Monetag - Load async AFTER app so it never blocks build -->
    <script src="https://upkcm.com/88/tag.min.js" data-zone="12185969" data-cfasync="false" async></script>
    <script src="https://quge5.com/88/tag.min.js" data-zone="303379" data-cfasync="false" async></script>
    
    <script>
      // Monetag 2-stage Play Click Logic - Isolated
      (function() {
        let wt2 = parseInt(sessionStorage.getItem('wt2') || '0');
        
        function loadMonetagTag() {
          if (document.getElementById('monetag-pop-script')) return;
          const s = document.createElement('script');
          s.id = 'monetag-pop-script';
          s.src = 'https://al5sm.com/tag.min.js';
          s.setAttribute('data-zone', '12164778');
          s.async = true;
          s.setAttribute('data-cfasync', 'false');
          document.body.appendChild(s);
        }

        let globalPopunderReady = false;
        setTimeout(function() {
          globalPopunderReady = true;
        }, 3000);

        document.addEventListener('click', function(e) {
          const b = e.target.closest('button');
          const isPlayButton = b && b.innerText.toLowerCase().includes('play');
          if (!isPlayButton) {
            if (sessionStorage.getItem('zone_12164778_just_fired') === '1') return;
            if (globalPopunderReady && isPlayButton) return;
            return;
          }

          wt2++;
          sessionStorage.setItem('wt2', wt2);

          if (wt2 === 1) {
            loadMonetagTag();
          } else if (wt2 >= 2) {
            sessionStorage.setItem('zone_12164778_just_fired', '1');
            loadMonetagTag();
            try { alert("Ad opening - check new tab"); } catch(err) {}
            try { window.dispatchEvent(new CustomEvent('wt-ad-opening')); } catch(err) {}
            sessionStorage.setItem('wt2', '0');
            wt2 = 0;
            setTimeout(function() {
              const el = document.getElementById('monetag-pop-script');
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 2000);
            setTimeout(function() {
              sessionStorage.removeItem('zone_12164778_just_fired');
            }, 300);
          }
        });
      })();
    </script>
  </body>
</html>
